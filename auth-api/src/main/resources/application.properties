spring.application.name=auth-api

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

app.jwt-secret=${JWT_SECRET:dev-jwt-secret-very-long}
app.internal-token=${INTERNAL_TOKEN:dev-secret}
app.data-api-url=${DATA_API_URL:http://localhost:8081/api/transform}

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
